{% extends "base.html" %}
{% block content %}
    <h1>Admin Login</h1>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Password</label>
        <input type="password" name="password" required autofocus>
        <button type="submit">Log in</button>
    </form>
{% endblock %}
